#!/bin/bash

# PulseAudio Volume Block
# Shows the volume of the default PulseAudio sink
# Dependencies: pamixer (part of pulseaudio package)

get_volume() {
    pamixer --get-volume
}

print_volume() {
    echo " $(get_volume)%"
}

increase_volume() {
    pamixer -i 5
}

decrease_volume() {
    pamixer -d 5
}

toggle_mute() {
    pamixer -t
}

case "$1" in
    --update)
        print_volume ;;
    --up)
        increase_volume ;;
    --down)
        decrease_volume ;;
    --mute)
        toggle_mute ;;
    *)
        print_volume ;;
esac
