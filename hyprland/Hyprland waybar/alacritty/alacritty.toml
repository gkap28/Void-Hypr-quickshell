[general]
live_config_reload = true

[window]
padding = { x = 5, y = 5 }
opacity = 0.9

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 11

[font.normal]
family = "JetBrains Mono Nerd Font"
style = "Medium"

[font.bold]
family = "JetBrains Mono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style = "MediumItalic"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style = "Bold_Italic"

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#11121D"
foreground = "#a9b1d6"

[colors.normal]
black = "#32344a"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#0db9d7"
white = "#acb0d0"

[cursor]
style = { shape = "Beam", blinking = "Off" }
blink_interval = 750

[selection]
save_to_clipboard = false

[terminal.shell]
program = "/usr/bin/bash"

[[keyboard.bindings]]
key = "Return"
mods = "Super|Shift"
action = "SpawnNewInstance"

[terminal]
