#------------------------------------------
# My Personal Settings
#------------------------------------------

set show_hidden true
set colorscheme mytheme
set draw_borders true
set confirm_on_delete always


set show_bookmarks_in_preview true
set automatically_count_files true
set confirmation_type both



# Custom Keybindings
map a cut
map c copy
map v map v mark_files toggle=True movedown=False
map u console rename 
map l console delete
map e paste
map s save_copy_buffer

# CD Navigation Shortcuts
map :cd console cd 
map :cd  cd ~

# Neue Ordner und Dateien erstellen
map mn console mkdir
map mf console touch

# Ordner in Systemverzeichnissen mit Root-Rechten erstellen
map mN console shell sudo mkdir -p
map mF console shell sudo touch

# Ordner und Dateien mit Root-Rechten im schwebenden 900x600-Fenster erstellen
map mN console shell alacritty --class floating_terminal -o initial_window_width=900 -o initial_window_height=600 sudo mkdir -p 
map mF console shell alacritty --class floating_terminal -o initial_window_width=900 -o initial_window_height=600 sudo touch 



# Dateien oder Ordner in Systemverzeichnissen mit Root-Rechten löschen
map L shell sudo rm -rf %s

# USB-Medien sicher auswerfen (ex = Ex-Hdd, ub = USB/Ventoy)

# USB-Medien sicher auswerfen (Strg+u + x / Strg+u + u)
map <C-u>x shell sudo umount /run/media/georg/Ex-Hdd && ranger --notify "Ex-Hdd sicher entfernt!"
map <C-u>u shell sudo umount /run/media/georg/Ventoy && ranger --notify "USB-Stick sicher entfernt!"

# Separates Terminal im aktuellen Verzeichnis öffnen
map t shell alacritty &
map gU cd /run/media/georg