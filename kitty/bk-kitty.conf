# Para utilizar estos temas se debe crear un link simbólico
# include kitty-themes/themes/Brogrammer.conf
# include kitty-themes/themes/Dark_Pastel.conf
# include kitty-themes/themes/Vibrantink.conf
# include kitty-themes/themes/Wryan.conf

shell_integration disabled

#Oculta la barra de título (title bar)
hide_window_decorations yes


remember_window_size  no
initial_window_width  100c
initial_window_height 38c

#background_opacity

background_opacity 0.80

#background_image batman.png
#background_image_layout

# Copy and paste shortcut
copy_on_select yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Tabs
map ctrl+right next_tab
map ctrl+left previous_tab

# Layout
map ctrl+shift+l next_layout
map ctrl+alt+p last_used_layout

# Aumentar tamaño de fuente
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+kp_add change_font_size all +1.0

# Disminuir tamaño de fuente
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+kp_subtract change_font_size all -1.0

# Resetear tamaños de fuentes al original
map ctrl+shift+backspace change_font_size all 0

# Alternar pantalla completa

map ctrl+shift+f11 toggle_fullscreen

# 







font_family ComicMono 


# static font: FiraCode-Regular.ttf, FiraCode-Bold.ttf, ...
Fira Code
    Fira Code Bold (FiraCode-Bold)
    Fira Code Light (FiraCode-Light)

# variable font: FiraCode-VF.ttf
Fira Code
    Fira Code Light ()
    Fira Code Light (FiraCodeRoman_700wght)
    Fira Code Light (FiraCode-Light)
font_size               11

#tab_bar_min_tabs        1
#tab_bar_style           powerline
#tab_activity_symbol     λ
#active_tab_font_style   normal
#active_tab_foreground   #ccc
#active_tab_background   #777
#active_tab_font_style   bold-italic
#inactive_tab_foreground #ccc
#inactive_tab_background #333
#inactive_tab_font_style normal

tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}


enable_audio_bell       no
disable_ligatures       never
strip_trailing_spaces   smart
placement_strategy      center

# remove open link with mouse click
clear_all_mouse_actions yes
mouse_map left press ungrabbed mouse_selection normal



