# -*- conf-unix -*-

[main]
# Schriftart und Schriftgröße (JetBrainsMono Nerd Font)
font=JetBrainsMono Nerd Font:size=12
font-bold=JetBrainsMono Nerd Font:bold:size=12
font-italic=JetBrainsMono Nerd Font:italic:size=12
font-bold-italic=JetBrainsMono Nerd Font:bold:italic:size=12

# Start-Größe des Fensters beim Öffnen
initial-window-size-chars=90x25

# Abstände zum Fensterrand
pad=12x12

# Terminal-Typ
term=foot

[environment]
COLORTERM=truecolor

# Farbsektion mit Transparenz
[colors-dark]
alpha=0.85
background=1a1b26
foreground=a9b1d6

## Normale Farben
regular0=414868  # black
regular1=f7768e  # red
regular2=9ece6a  # green
regular3=e0af68  # yellow
regular4=7aa2f7  # blue
regular5=bb9af7  # magenta
regular6=7dcfff  # cyan
regular7=a9b1d6  # white

## Helle/Saturierte Farben
bright0=414868   # bright black
bright1=f7768e   # bright red
bright2=9ece6a   # bright green
bright3=e0af68   # bright yellow
bright4=7aa2f7   # bright blue
bright5=bb9af7   # bright magenta
bright6=7dcfff   # bright cyan
bright7=c0caf5   # bright white

[cursor]
# Nur noch das Verhalten des Cursors wird hier definiert
style=block
blink=yes

[mouse]
hide-when-typing=yes
