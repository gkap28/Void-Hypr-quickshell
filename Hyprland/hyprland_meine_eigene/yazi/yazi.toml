[mgr]
ratio = [1, 4, 3]
show_hidden = true
sort_by = "alphabetical"
sort_dir_first = true          # Directories listed before files
scrolloff    = 5               # Cursor padding from edge
linemode     = "none"          # none, size, mtime, permissions, owner
sort_sensitive = false
sort_reverse = false

 [opener]
 edit = [
     { run = '~/.local/bin/yazi-editor "$@"', block = true, desc = "Neovim" }
 ]

# [opener]
# edit = [
#   { run = '${EDITOR:-vi} "$@"', block = true, desc = "Edit" },
# ]


open = [
    { run = 'xdg-open "$@"', desc = "Oeffnen" }
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/x-shellscript", use = "edit" },
    { mime = "application/xml", use = "edit" },

    { mime = "image/*", use = "open" },
    { mime = "application/pdf", use = "open" },

    { mime = "application/*", use = "open" },

    { mime = "*", use = "edit" }
]

[preview]
# Bild-Vorschau über Sixel (absolut stabil und sicher für das foot-Terminal)
image_provider = "sixel"
image_delay = 30
max_width = 1500
max_height = 1500
image_quality = 75
